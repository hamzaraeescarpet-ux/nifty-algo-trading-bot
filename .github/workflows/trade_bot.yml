name: Nifty 50 Algo Trading Bot Runner

on:
  schedule:
    # Triggers Monday to Friday at 03:39 UTC (09:09 AM IST) and 03:44 UTC (09:14 AM IST)
    - cron: '39 3 * * 1-5'
    - cron: '44 3 * * 1-5'
  workflow_dispatch: # Allows 1-click manual trigger from GitHub web / mobile app anytime
    inputs:
      mode:
        description: 'Execution Mode (simulate to test now, live for real market hours)'
        required: true
        default: 'live'
        type: choice
        options:
          - live
          - simulate

concurrency:
  group: nifty-trading-bot-execution
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-trading-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Nifty 50 Algo Trading Bot
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          TRADING_MODE: ${{ secrets.TRADING_MODE || 'PAPER' }}
          INITIAL_CAPITAL: ${{ secrets.INITIAL_CAPITAL || '100000.0' }}
          RISK_PER_TRADE_PERCENT: ${{ secrets.RISK_PER_TRADE_PERCENT || '1.0' }}
          MAX_DAILY_LOSS_PERCENT: ${{ secrets.MAX_DAILY_LOSS_PERCENT || '2.0' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" = "simulate" ]; then
            echo "Running in SIMULATION / REPLAY mode..."
            python run_bot.py --simulate
          else
            echo "Running in LIVE MARKET mode..."
            python run_bot.py
          fi

      - name: Save Trade Journal Logs to Repository
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/paper_trades_journal.json dashboard/report.html || true
          git commit -m "Auto-update trade journal and dashboard report [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Push skipped or not needed"
