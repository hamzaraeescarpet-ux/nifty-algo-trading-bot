name: Nifty 50 Algo Trading Bot Runner

on:
  schedule:
    # Triggers Monday to Friday at 03:40 UTC (09:10 AM IST)
    - cron: '40 3 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub web / mobile app anytime

jobs:
  run-trading-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 380 # Standard session (9:15 AM to 3:30 PM IST ~ 6h 15m)

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Nifty 50 Algo Trading Bot
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          TRADING_MODE: ${{ secrets.TRADING_MODE || 'PAPER' }}
          INITIAL_CAPITAL: ${{ secrets.INITIAL_CAPITAL || '100000.0' }}
          RISK_PER_TRADE_PERCENT: ${{ secrets.RISK_PER_TRADE_PERCENT || '1.0' }}
          MAX_DAILY_LOSS_PERCENT: ${{ secrets.MAX_DAILY_LOSS_PERCENT || '2.0' }}
          KOTAK_CONSUMER_KEY: ${{ secrets.KOTAK_CONSUMER_KEY }}
          KOTAK_CONSUMER_SECRET: ${{ secrets.KOTAK_CONSUMER_SECRET }}
          KOTAK_MOBILE_NUMBER: ${{ secrets.KOTAK_MOBILE_NUMBER }}
          KOTAK_PASSWORD: ${{ secrets.KOTAK_PASSWORD }}
          KOTAK_MPIN: ${{ secrets.KOTAK_MPIN }}
          KOTAK_TOTP_KEY: ${{ secrets.KOTAK_TOTP_KEY }}
        run: |
          python run_bot.py

      - name: Save Trade Journal Logs to Repository
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/paper_trades_journal.json || true
          git commit -m "Auto-update trade journal [skip ci]" || true
          git push || true
